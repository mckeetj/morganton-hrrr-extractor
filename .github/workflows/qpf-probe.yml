name: NWS Hourly QPF Validation Probe

on:
  push:
    branches:
      - validation/nws-hourly-qpf-probe
    paths:
      - ".github/workflows/qpf-probe.yml"
      - "validation_tools/probe_nws_hourly_qpf.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/nws-hourly-qpf-probe

      - name: Run NWS hourly-QPF probe
        run: python validation_tools/probe_nws_hourly_qpf.py

      - name: Commit validation output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_outputs/morg-qpf-probe.json
          if git diff --cached --quiet; then
            echo "No validation output change"
          else
            git commit -m "Record NWS hourly QPF validation output [skip ci]"
            git push origin HEAD:validation/nws-hourly-qpf-probe
          fi
