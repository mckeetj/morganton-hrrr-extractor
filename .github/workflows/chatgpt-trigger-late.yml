name: ChatGPT Trigger - Late HRRR and ECONet

# Independent trigger path for the late-morning decision-support refresh.
# A ChatGPT scheduled task updates triggers/late-model-refresh.txt; this push
# then dispatches the existing production workflow through workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "triggers/late-model-refresh.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: "chatgpt-trigger-late"
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production HRRR and ECONet workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-hrrr.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Dispatched update-hrrr.yml"
