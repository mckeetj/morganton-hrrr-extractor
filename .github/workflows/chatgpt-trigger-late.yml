name: ChatGPT Trigger - Late HRRR and ECONet

# Manual fallback trigger path for the late-morning decision-support refresh.
# A deliberate push to triggers/late-model-refresh.txt dispatches the existing
# production workflow. Routine timing is owned by weather-orchestrator.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "triggers/late-model-refresh.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: "chatgpt-trigger-late"
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production HRRR and ECONet workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-hrrr.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Dispatched update-hrrr.yml"
