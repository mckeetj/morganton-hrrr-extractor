name: Generate Downburst Handoff

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Which Daily Downburst handoff to generate"
        required: true
        type: choice
        options:
          - initial
          - refresh
      force:
        description: "Regenerate even if this run already exists for today"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "downburst-handoff-${{ inputs.source_run }}"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.1' }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify OpenAI API secret
        run: |
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured."
            exit 2
          fi

      - name: Generate validated handoff
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--run "${SOURCE_RUN}" --output current/downburst-outlook.json)
          if [[ "${FORCE}" == "true" ]]; then
            args+=(--force)
          fi
          python -m burke_hrrr.downburst_ai "${args[@]}"

      - name: Validate output shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("current/downburst-outlook.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["schema_version"] == 1
          assert isinstance(data["downburst_index"], int)
          assert 0 <= data["downburst_index"] <= 100
          assert data["verdict"] in {"LOW", "CONDITIONAL", "ELEVATED", "HIGH"}
          assert data["confidence"] in {"Low", "Moderate", "High"}
          assert data["source_run"] in {"8:30 AM Initial", "11:00 AM Model Refresh"}
          assert data["spc_category"] in {
              "General", "Thunderstorms", "Marginal", "Slight",
              "Enhanced", "Moderate", "High"
          }
          assert data["handoff_status"] == "Automated reviewed handoff"

          expected = (
              "LOW" if data["downburst_index"] <= 24
              else "CONDITIONAL" if data["downburst_index"] <= 44
              else "ELEVATED" if data["downburst_index"] <= 64
              else "HIGH"
          )
          assert data["verdict"] == expected

          print(json.dumps(data, indent=2))
          PY

      - name: Commit accepted handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current/downburst-outlook.json

          if git diff --cached --quiet; then
            echo "No handoff change to commit"
            exit 0
          fi

          git commit -m "Publish GitHub-native Downburst handoff"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## GitHub-native Daily Downburst handoff"
            echo
            echo "- Requested run: ${{ inputs.source_run }}"
            echo "- Model: ${OPENAI_MODEL}"
            echo "- Force: ${{ inputs.force }}"
            echo "- Output: current/downburst-outlook.json"
            echo
            echo "The committed handoff triggers the Operational Readiness Hub snapshot workflow through the existing current/downburst-outlook.json push path."
          } >> "${GITHUB_STEP_SUMMARY}"
