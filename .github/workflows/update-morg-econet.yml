name: Update MORG ECONet Morning Context

on:
  workflow_dispatch:
  schedule:
    # Trigger early to absorb GitHub scheduler delays, then wait until just
    # before the 8:30 AM briefing before querying MORG.
    - cron: "53 5 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "econet-morning"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait until 8:05 AM Eastern if triggered early
        run: |
          python - <<'PY'
          import datetime as dt
          import time
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          now = dt.datetime.now(dt.UTC).astimezone(eastern)
          target = now.replace(hour=8, minute=5, second=0, microsecond=0)
          if now < target:
              wait_seconds = (target - now).total_seconds()
              print(f"Waiting {wait_seconds / 60:.1f} minutes until {target.isoformat()}")
              time.sleep(wait_seconds)
          else:
              print(f"Already past 8:05 AM Eastern ({now.isoformat()}); continuing immediately")
          PY

      - name: Set current local date tag
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          local_now = dt.datetime.now(dt.UTC).astimezone(ZoneInfo("America/New_York"))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LOCAL_DATE_TAG={local_now:%Y%m%d}\n")
          PY

      - name: Preserve current HRRR JSON and any current-day versioned files
        run: |
          mkdir -p public/hrrr public/econet
          CB="$(date +%s)"

          # Prefer the current-day immutable HRRR path if it already exists.
          if curl \
            --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/hrrr/${LOCAL_DATE_TAG}-12z.json?cb=${CB}" \
            --output "public/hrrr/${LOCAL_DATE_TAG}-12z.json"; then
            cp "public/hrrr/${LOCAL_DATE_TAG}-12z.json" public/burke-hrrr.json
            echo "Preserved current-day versioned HRRR JSON"
          else
            rm -f "public/hrrr/${LOCAL_DATE_TAG}-12z.json"
            curl \
              --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              -H "Cache-Control: no-cache" \
              "https://mckeetj.github.io/morganton-hrrr-extractor/burke-hrrr.json?cb=${CB}" \
              --output public/burke-hrrr.json
            echo "Current-day HRRR not published yet; preserved latest stable HRRR JSON"
          fi
          python -m json.tool public/burke-hrrr.json > /dev/null

          # If the late-morning ECONet slot already exists because this run was delayed,
          # preserve it so this deployment cannot erase the later combined refresh.
          if curl \
            --fail --silent --show-error --location \
            --retry 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/econet/${LOCAL_DATE_TAG}-1030.json?cb=${CB}" \
            --output "public/econet/${LOCAL_DATE_TAG}-1030.json"; then
            echo "Preserved current-day late-morning ECONet slot"
          else
            rm -f "public/econet/${LOCAL_DATE_TAG}-1030.json"
          fi

      - name: Run MORG ECONet extractor
        env:
          NCSCO_CLOUDS_HASH: ${{ secrets.NCSCO_CLOUDS_HASH }}
        run: |
          PYTHONPATH=. python -m burke_hrrr.econet --output public/morg-econet.json

      - name: Validate generated MORG ECONet JSON
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          data = json.loads(Path("public/morg-econet.json").read_text(encoding="utf-8"))
          if data.get("station", {}).get("id") != "MORG":
              raise SystemExit("ECONet output is not for MORG")
          if data.get("schema_version") != 1:
              raise SystemExit(f"unexpected ECONet schema: {data.get('schema_version')!r}")

          generated = dt.datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
          age_minutes = (
              dt.datetime.now(dt.UTC) - generated.astimezone(dt.UTC)
          ).total_seconds() / 60
          if age_minutes < -5 or age_minutes > 20:
              raise SystemExit(f"ECONet generated_at is unexpectedly stale: {age_minutes:.1f} minutes")

          status = data.get("status")
          if status not in {"current", "stale", "unavailable"}:
              raise SystemExit(f"unexpected ECONet status: {status!r}")
          if status != "unavailable":
              rainfall = data.get("rainfall", {})
              soil = data.get("soil_moisture", {})
              for period in ("24h", "72h", "168h"):
                  if period not in rainfall:
                      raise SystemExit(f"missing ECONet rainfall period: {period}")
              for depth in ("10cm", "20cm"):
                  if depth not in soil:
                      raise SystemExit(f"missing ECONet soil depth: {depth}")
                  if soil[depth].get("qc_score") not in {0, 1}:
                      raise SystemExit(f"unacceptable current QC score for {depth}")
                  if "value" in soil[depth] or "current_value_m3m3" in soil[depth]:
                      raise SystemExit("public ECONet summary must not republish raw soil-moisture values")
          print(f"MORG ECONet status: {status}")
          print(f"Generated: {data['generated_at']}")
          PY

      - name: Create date-versioned morning ECONet path
        run: |
          mkdir -p public/econet
          cp public/morg-econet.json "public/econet/${LOCAL_DATE_TAG}-0830.json"
          echo "Published ECONet path: econet/${LOCAL_DATE_TAG}-0830.json"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
