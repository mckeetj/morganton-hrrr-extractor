name: Weather Data Orchestrator

# Resilient primary clock for Morganton decision-support data.
#
# GitHub's native schedule can arrive many hours late. Instead of scheduling
# near the protected data windows, this workflow is seeded at noon the prior
# day and relays itself through workflow_dispatch until the morning windows.
# workflow_dispatch has proven prompt even while native scheduled events are
# backlogged. Production snapshot windows remain unchanged.

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Eastern target date (YYYY-MM-DD); blank = auto"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "triggers/weather-clock.txt"
  schedule:
    # Seed the next day's clock far in advance. If this event is delayed past
    # midnight but still arrives before noon, it automatically targets today.
    - cron: "0 12 * * *"
      timezone: "America/New_York"

permissions:
  actions: write
  contents: read

concurrency:
  group: "weather-data-orchestrator"
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve target Eastern date
        id: target
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          now = dt.datetime.now(dt.UTC).astimezone(eastern)
          supplied = (os.environ.get("INPUT_TARGET_DATE") or "").strip()

          if supplied:
              target = dt.date.fromisoformat(supplied)
              source = "workflow_dispatch"
          elif os.environ.get("EVENT_NAME") == "push":
              raw = Path("triggers/weather-clock.txt").read_text(
                  encoding="utf-8"
              ).strip().splitlines()[0]
              target = dt.date.fromisoformat(raw)
              source = "push seed"
          else:
              # A noon seed normally targets tomorrow. If GitHub delivers that
              # seed after midnight but before noon, target the current date.
              target = now.date() if now.hour < 12 else now.date() + dt.timedelta(days=1)
              source = "scheduled seed"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"target_date={target.isoformat()}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TARGET_DATE={target.isoformat()}\n")

          print(f"Eastern now: {now.isoformat()}")
          print(f"Target date: {target.isoformat()} ({source})")
          PY

      - name: Relay clock or run protected-window dispatches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          seconds_until() {
            local clock="$1"
            TARGET_CLOCK="$clock" python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          target_date = dt.date.fromisoformat(os.environ["TARGET_DATE"])
          hour, minute = map(int, os.environ["TARGET_CLOCK"].split(":"))
          target = dt.datetime.combine(
              target_date, dt.time(hour, minute), tzinfo=eastern
          )
          now = dt.datetime.now(dt.UTC).astimezone(eastern)
          print(int((target - now).total_seconds()))
          PY
          }

          local_now_iso() {
            python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          print(dt.datetime.now(dt.UTC).astimezone(
              ZoneInfo("America/New_York")
          ).isoformat())
          PY
          }

          dispatch_successor() {
            echo "Relaying clock for ${TARGET_DATE}"
            gh workflow run weather-orchestrator.yml               --repo "${GITHUB_REPOSITORY}"               --ref main               -f target_date="${TARGET_DATE}"
          }

          workflow_active() {
            local workflow="$1"
            local count
            count="$(gh run list               --repo "${GITHUB_REPOSITORY}"               --workflow "${workflow}"               --limit 12               --json status               --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
            [[ "${count}" != "0" ]]
          }

          dispatch_if_idle() {
            local workflow="$1"
            if workflow_active "${workflow}"; then
              echo "${workflow} already queued/running"
            else
              gh workflow run "${workflow}"                 --repo "${GITHUB_REPOSITORY}"                 --ref main
              echo "Dispatched ${workflow} at $(local_now_iso)"
            fi
          }

          wait_until() {
            local target="$1"
            local seconds
            seconds="$(seconds_until "${target}")"
            if (( seconds > 0 )); then
              echo "Waiting ${seconds}s until ${TARGET_DATE} ${target} Eastern"
              sleep "${seconds}"
            fi
          }

          # If the clock is still well before the morning window, hand off to
          # a fresh run before this job approaches GitHub's six-hour limit.
          TO_MORNING="$(seconds_until "08:05")"
          if (( TO_MORNING > 10800 )); then
            # Leave the successor about 2h45m before 08:05, but never hold a
            # single runner more than four hours before relaying.
            SLEEP_FOR=$(( TO_MORNING - 9900 ))
            if (( SLEEP_FOR > 14400 )); then
              SLEEP_FOR=14400
            fi
            if (( SLEEP_FOR < 60 )); then
              SLEEP_FOR=60
            fi
            echo "Clock is early; sleeping ${SLEEP_FOR}s before relay"
            sleep "${SLEEP_FOR}"
            dispatch_successor
            exit 0
          fi

          # Abort stale relays that somehow survive past noon on the target day.
          TO_NOON="$(seconds_until "12:00")"
          if (( TO_NOON < -300 )); then
            echo "::warning::Weather clock reached after target-day noon; exiting"
            exit 0
          fi

          # Morning MORG attempts. Missed checkpoints are skipped rather than
          # relabeled; the production workflow enforces the protected window.
          for checkpoint in "08:05" "08:18" "08:25"; do
            remaining="$(seconds_until "${checkpoint}")"
            if (( remaining >= -60 )); then
              wait_until "${checkpoint}"
              dispatch_if_idle update-morg-econet.yml
            fi
          done

          # Late MORG + 12Z HRRR attempts. The production workflow independently
          # decides which product still needs recovery.
          for checkpoint in "10:05" "10:25" "10:40"; do
            remaining="$(seconds_until "${checkpoint}")"
            if (( remaining >= -60 )); then
              wait_until "${checkpoint}"
              dispatch_if_idle update-hrrr.yml
            fi
          done

          # If a heavily delayed relay first arrives after the normal checkpoints
          # but before noon, make one best-effort late recovery dispatch.
          TO_LATE_FINAL="$(seconds_until "10:40")"
          TO_NOON="$(seconds_until "12:00")"
          if (( TO_LATE_FINAL < -60 && TO_NOON > 0 )); then
            dispatch_if_idle update-hrrr.yml
          fi

          echo "Weather clock completed for ${TARGET_DATE}"
