name: Update Burke County HRRR and MORG ECONet Data

# V3.5: persist/restore the current-day 08:30 ECONet snapshot through GitHub Actions cache.

on:
  workflow_dispatch:
  schedule:
    # Start very early to absorb GitHub scheduler delays. The job then waits
    # for the current-day 12Z HRRR terminal forecast hour needed through local midnight.
    - cron: "47 5 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "hrrr-refresh"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install extractors and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Wait for current-day 12Z HRRR through local midnight
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import time
          from zoneinfo import ZoneInfo

          from burke_hrrr.noaa import Cycle, cycle_has_forecast, forecast_hour_through

          eastern = ZoneInfo("America/New_York")
          now = dt.datetime.now(dt.UTC)
          local_now = now.astimezone(eastern)
          cycle_time = dt.datetime.combine(local_now.date(), dt.time(12), tzinfo=dt.UTC)
          through = (local_now + dt.timedelta(days=1)).replace(
              hour=0, minute=0, second=0, microsecond=0
          )
          required_fhr = forecast_hour_through(cycle_time, through)
          cycle = Cycle(cycle_time)
          if required_fhr < 0 or required_fhr > 48:
              raise SystemExit(f"invalid required forecast hour: f{required_fhr:02d}")

          print(
              f"Waiting for {cycle_time:%Y%m%d%H} HRRR f{required_fhr:02d} "
              f"to cover {through.isoformat()}"
          )
          attempts = 61  # immediate check plus up to ~5 hours of waiting
          for attempt in range(1, attempts + 1):
              if cycle_has_forecast(cycle, required_fhr, timeout=20.0):
                  print(f"12Z HRRR terminal hour f{required_fhr:02d} is available")
                  break
              if attempt == attempts:
                  raise SystemExit(
                      f"12Z HRRR f{required_fhr:02d} was not available after ~5 hours"
                  )
              print(
                  f"12Z HRRR f{required_fhr:02d} not ready "
                  f"(attempt {attempt}/{attempts}); retrying in 5 minutes"
              )
              time.sleep(300)

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as env:
              env.write(f"HRRR_CYCLE={cycle_time:%Y%m%d%H}\n")
              env.write(f"HRRR_REQUIRED_FHR={required_fhr}\n")
              env.write(f"HRRR_EXPECTED_THROUGH={through.isoformat()}\n")
              env.write(f"LOCAL_DATE_TAG={local_now:%Y%m%d}\n")
          PY

      - name: Run Burke County HRRR extractor
        run: |
          mkdir -p public
          burke-hrrr \
            --cycle "${HRRR_CYCLE}" \
            --workdir "${RUNNER_TEMP}/hrrr-data" \
            --output public/burke-hrrr.json

      - name: Prepare 8:30 AM ECONet restore location
        run: mkdir -p handoff public/econet

      - name: Restore current-day 8:30 AM ECONet snapshot
        uses: actions/cache/restore@v4
        with:
          path: handoff/morg-econet-0830.json
          key: morg-econet-0830-${{ env.LOCAL_DATE_TAG }}-v36
          fail-on-cache-miss: true

      - name: Validate and stage restored 8:30 AM ECONet snapshot
        run: |
          test -s handoff/morg-econet-0830.json
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tag = os.environ["LOCAL_DATE_TAG"]
          source = Path("handoff/morg-econet-0830.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("station", {}).get("id") != "MORG":
              raise SystemExit("restored ECONet file is not for MORG")
          if data.get("schema_version") != 1:
              raise SystemExit(f"unexpected restored ECONet schema: {data.get('schema_version')!r}")
          generated = dt.datetime.fromisoformat(
              str(data["generated_at"]).replace("Z", "+00:00")
          ).astimezone(ZoneInfo("America/New_York"))
          if generated.strftime("%Y%m%d") != tag:
              raise SystemExit(
                  f"restored ECONet snapshot is from {generated:%Y%m%d}, expected {tag}"
              )
          target = Path(f"public/econet/{tag}-0830.json")
          target.write_bytes(source.read_bytes())
          print(f"Restored and staged required 0830 ECONet snapshot: {target}")
          print(f"Snapshot generated: {generated.isoformat()}")
          PY

      - name: Run MORG ECONet extractor
        env:
          NCSCO_CLOUDS_HASH: ${{ secrets.NCSCO_CLOUDS_HASH }}
        run: |
          morg-econet --output public/morg-econet.json

      - name: Validate generated current-day HRRR JSON
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import math
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          now = dt.datetime.now(dt.UTC)
          local_now = now.astimezone(eastern)
          expected_cycle = dt.datetime.combine(local_now.date(), dt.time(12), tzinfo=dt.UTC)
          expected_through = (local_now + dt.timedelta(days=1)).replace(
              hour=0, minute=0, second=0, microsecond=0
          )

          path = Path("public/burke-hrrr.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          required_top_level = [
              "schema_version",
              "extractor_version",
              "generated_at",
              "cycle_initialized",
              "through",
              "forecast_hours",
              "operational_summary",
          ]
          missing = [key for key in required_top_level if key not in data]
          if missing:
              raise SystemExit(f"missing required HRRR JSON fields: {missing}")
          if data["schema_version"] != 2:
              raise SystemExit(f"expected HRRR schema_version 2, got {data['schema_version']!r}")
          if data.get("extractor_version") != "0.3.2":
              raise SystemExit(
                  f"expected extractor_version 0.3.2, got {data.get('extractor_version')!r}"
              )
          if not data["forecast_hours"]:
              raise SystemExit("HRRR forecast_hours is empty")

          generated = dt.datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
          age_minutes = (now - generated.astimezone(dt.UTC)).total_seconds() / 60
          if age_minutes < -5 or age_minutes > 45:
              raise SystemExit(
                  f"HRRR generated_at is unexpectedly stale: {age_minutes:.1f} minutes"
              )

          cycle = dt.datetime.fromisoformat(
              data["cycle_initialized"].replace("Z", "+00:00")
          ).astimezone(dt.UTC)
          if cycle != expected_cycle:
              raise SystemExit(
                  f"wrong HRRR cycle: expected {expected_cycle.isoformat()}, got {cycle.isoformat()}"
              )

          through = dt.datetime.fromisoformat(data["through"].replace("Z", "+00:00"))
          if through.astimezone(dt.UTC) < expected_through.astimezone(dt.UTC):
              raise SystemExit(
                  f"HRRR coverage ends too early: {through.isoformat()} < "
                  f"{expected_through.isoformat()}"
              )

          valid_times = [
              dt.datetime.fromisoformat(str(hour["valid_time"]).replace("Z", "+00:00"))
              for hour in data["forecast_hours"]
              if hour.get("valid_time")
          ]
          if not valid_times or max(t.astimezone(dt.UTC) for t in valid_times) < expected_through.astimezone(dt.UTC):
              raise SystemExit("HRRR forecast_hours do not actually reach local midnight")

          required_diagnostics = {
              "surface_gust_mph",
              "max_downdraft_magnitude_ms",
              "cape_90_0mb_jkg",
              "lapse_rate_700_500mb_k_per_km",
              "bulk_shear_sfc_500mb_kt",
          }

          def usable_metric(key: str) -> bool:
              for hour in data["forecast_hours"]:
                  diagnostics = hour.get("key_diagnostics")
                  if not isinstance(diagnostics, dict):
                      continue
                  metric = diagnostics.get(key)
                  if not isinstance(metric, dict):
                      continue
                  summary = metric.get("summary")
                  if not isinstance(summary, dict) or int(summary.get("count") or 0) <= 0:
                      continue
                  values = [summary.get("p90"), summary.get("max")]
                  if any(isinstance(v, (int, float)) and math.isfinite(float(v)) for v in values):
                      return True
              return False

          unusable = sorted(key for key in required_diagnostics if not usable_metric(key))
          if unusable:
              raise SystemExit(
                  "HRRR core diagnostics have no finite populated values: "
                  + ", ".join(unusable)
              )

          shear_values = []
          for hour in data["forecast_hours"]:
              metric = (hour.get("key_diagnostics") or {}).get("bulk_shear_sfc_500mb_kt")
              if isinstance(metric, dict) and isinstance(metric.get("summary"), dict):
                  for stat in ("p90", "max"):
                      value = metric["summary"].get(stat)
                      if isinstance(value, (int, float)) and math.isfinite(float(value)):
                          shear_values.append(float(value))
          if not shear_values or min(shear_values) < 0 or max(shear_values) > 200:
              raise SystemExit(
                  f"deep-layer shear proxy failed sanity check: {shear_values[:5]} ..."
              )

          metrics = data["operational_summary"].get("metrics", {})
          if not metrics:
              raise SystemExit("HRRR operational_summary.metrics is empty")

          print(f"HRRR generated: {data['generated_at']}")
          print(f"HRRR extractor: {data['extractor_version']}")
          print(f"HRRR cycle: {data['cycle_initialized']}")
          print(f"HRRR through: {data['through']}")
          print(f"HRRR forecast hours: {len(data['forecast_hours'])}")
          print(f"Deep-layer shear proxy max: {max(shear_values):.1f} kt")
          PY

      - name: Validate generated MORG ECONet JSON
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          path = Path("public/morg-econet.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("station", {}).get("id") != "MORG":
              raise SystemExit("ECONet output is not for MORG")
          if data.get("schema_version") != 1:
              raise SystemExit(f"unexpected ECONet schema: {data.get('schema_version')!r}")

          generated = dt.datetime.fromisoformat(data["generated_at"].replace("Z", "+00:00"))
          age_minutes = (
              dt.datetime.now(dt.UTC) - generated.astimezone(dt.UTC)
          ).total_seconds() / 60
          if age_minutes < -5 or age_minutes > 30:
              raise SystemExit(
                  f"ECONet generated_at is unexpectedly stale: {age_minutes:.1f} minutes"
              )

          status = data.get("status")
          if status not in {"current", "stale", "unavailable"}:
              raise SystemExit(f"unexpected ECONet status: {status!r}")
          if status == "unavailable":
              print(f"MORG ECONet unavailable: {data.get('reason', 'unspecified')}")
          else:
              rainfall = data.get("rainfall", {})
              soil = data.get("soil_moisture", {})
              for period in ("24h", "72h", "168h"):
                  if period not in rainfall:
                      raise SystemExit(f"missing ECONet rainfall period: {period}")
              for depth in ("10cm", "20cm"):
                  if depth not in soil:
                      raise SystemExit(f"missing ECONet soil depth: {depth}")
                  if soil[depth].get("qc_score") not in {0, 1}:
                      raise SystemExit(f"unacceptable current QC score for {depth}")
                  if "value" in soil[depth] or "current_value_m3m3" in soil[depth]:
                      raise SystemExit("public ECONet summary must not republish raw soil-moisture values")
              print(f"MORG ECONet status: {status}")
              print(f"Latest accepted observation: {data.get('freshness', {}).get('latest_accepted_observation_time')}")
              print(f"24h rain: {rainfall['24h'].get('total_inches')} in")
              print(f"72h rain: {rainfall['72h'].get('total_inches')} in")
              print(f"168h rain: {rainfall['168h'].get('total_inches')} in")
              print(f"10cm soil 24h change: {soil['10cm'].get('change_24h_m3m3')}")
              print(f"20cm soil 24h change: {soil['20cm'].get('change_24h_m3m3')}")
          PY

      - name: Create date-versioned decision-support paths
        run: |
          mkdir -p public/hrrr public/econet
          cp public/burke-hrrr.json "public/hrrr/${LOCAL_DATE_TAG}-12z.json"
          cp public/morg-econet.json "public/econet/${LOCAL_DATE_TAG}-1030.json"
          echo "Published HRRR path: hrrr/${LOCAL_DATE_TAG}-12z.json"
          echo "Published ECONet path: econet/${LOCAL_DATE_TAG}-1030.json"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
