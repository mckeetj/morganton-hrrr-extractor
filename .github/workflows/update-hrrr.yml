name: Update Burke County HRRR and MORG ECONet Data

# V3.8: resilient late-morning publishing. HRRR, 10:30 ECONet, and the
# morning 08:30 snapshot are independent: a missed 08:30 run can no longer
# prevent current-day HRRR or 10:30 ECONet products from publishing.

on:
  workflow_dispatch:
  schedule:
    # Multiple independent attempts. Early attempts are cheap availability
    # checks; later attempts provide automatic recovery if GitHub drops/delays
    # an earlier schedule event.
    - cron: "47 8 * * *"
      timezone: "America/New_York"
    - cron: "17 9 * * *"
      timezone: "America/New_York"
    - cron: "47 9 * * *"
      timezone: "America/New_York"
    - cron: "17 10 * * *"
      timezone: "America/New_York"
    - cron: "37 10 * * *"
      timezone: "America/New_York"
    - cron: "57 10 * * *"
      timezone: "America/New_York"
    - cron: "17 11 * * *"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "hrrr-refresh"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      deploy_needed: ${{ steps.publish_plan.outputs.deploy_needed }}
      local_date_tag: ${{ steps.meta.outputs.local_date_tag }}
      expect_0830: ${{ steps.repo_check.outputs.econet_0830_valid }}
      expect_1030: ${{ steps.final_state.outputs.econet_1030_valid }}
      expect_hrrr: ${{ steps.final_state.outputs.hrrr_valid }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Determine Eastern date, 10:30 slot, and required HRRR coverage
        id: meta
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          now_utc = dt.datetime.now(dt.UTC)
          local_now = now_utc.astimezone(eastern)
          today = local_now.date()
          tag = today.strftime("%Y%m%d")
          minutes = local_now.hour * 60 + local_now.minute

          slot_start = 10 * 60
          slot_end = 11 * 60 + 20
          if minutes < slot_start:
              slot_state = "before"
          elif minutes <= slot_end:
              slot_state = "in"
          else:
              slot_state = "after"

          cycle_time = dt.datetime.combine(today, dt.time(12), tzinfo=dt.UTC)
          through_local = dt.datetime.combine(
              today + dt.timedelta(days=1),
              dt.time(0),
              tzinfo=eastern,
          )
          through_utc = through_local.astimezone(dt.UTC)
          required_fhr = int(
              (through_utc - cycle_time).total_seconds() // 3600
          )
          if required_fhr < 0 or required_fhr > 48:
              raise SystemExit(f"invalid required HRRR forecast hour: {required_fhr}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"local_date_tag={tag}\n")
              out.write(f"econet_slot_state={slot_state}\n")
              out.write(f"hrrr_cycle={cycle_time:%Y%m%d%H}\n")
              out.write(f"hrrr_required_fhr={required_fhr}\n")
              out.write(f"hrrr_expected_through={through_utc.isoformat()}\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LOCAL_DATE_TAG={tag}\n")
              env.write(f"HRRR_CYCLE={cycle_time:%Y%m%d%H}\n")
              env.write(f"HRRR_REQUIRED_FHR={required_fhr}\n")
              env.write(f"HRRR_EXPECTED_THROUGH={through_utc.isoformat()}\n")

          print(f"Eastern now: {local_now.isoformat()}")
          print(f"10:30 ECONet slot state: {slot_state}")
          print(
              f"Required HRRR: {cycle_time:%Y%m%d%H} f{required_fhr:02d} "
              f"through {through_utc.isoformat()}"
          )
          PY

      - name: Validate current repository snapshots
        id: repo_check
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          tag = os.environ["LOCAL_DATE_TAG"]
          today = dt.datetime.strptime(tag, "%Y%m%d").date()
          expected_cycle = dt.datetime.combine(today, dt.time(12), tzinfo=dt.UTC)
          expected_through = dt.datetime.fromisoformat(
              os.environ["HRRR_EXPECTED_THROUGH"]
          ).astimezone(dt.UTC)

          def parse_time(value):
              return dt.datetime.fromisoformat(
                  str(value).replace("Z", "+00:00")
              )

          def econet_valid(path, start_minute, end_minute):
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
                  generated = parse_time(data["generated_at"]).astimezone(eastern)
                  minute = generated.hour * 60 + generated.minute
                  return (
                      data.get("station", {}).get("id") == "MORG"
                      and generated.date() == today
                      and start_minute <= minute <= end_minute
                      and data.get("status") == "current"
                      and data.get("freshness", {}).get("within_limit") is True
                      and data.get("quality_control", {}).get(
                          "flag_metadata_verified"
                      ) is True
                  )
              except Exception:
                  return False

          def hrrr_valid(path):
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
                  cycle = parse_time(data["cycle_initialized"]).astimezone(dt.UTC)
                  through = parse_time(data["through"]).astimezone(dt.UTC)
                  return cycle == expected_cycle and through >= expected_through
              except Exception:
                  return False

          states = {
              "econet_0830_valid": econet_valid(
                  "current/morg-econet-0830.json",
                  7 * 60 + 40,
                  8 * 60 + 50,
              ),
              "econet_1030_valid": econet_valid(
                  "current/morg-econet-1030.json",
                  10 * 60,
                  11 * 60 + 20,
              ),
              "hrrr_valid": hrrr_valid("current/burke-hrrr-12z.json"),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in states.items():
                  out.write(f"{key}={'true' if value else 'false'}\n")

          print(json.dumps(states, indent=2, sort_keys=True))
          PY

      - name: Validate current-day Pages products
        id: pages_check
        run: |
          mkdir -p /tmp/late-check
          CB="$(date +%s%N)"

          set +e
          curl \
            --fail --silent --show-error --location \
            --retry 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/econet/${LOCAL_DATE_TAG}-1030.json?cb=${CB}" \
            --output /tmp/late-check/1030.json
          ECONET_RC=$?

          curl \
            --fail --silent --show-error --location --head \
            --retry 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/hrrr/${LOCAL_DATE_TAG}-12z.json?cb=${CB}" \
            --output /tmp/late-check/hrrr-head.txt
          HRRR_RC=$?
          set -e

          ECONET_RC="${ECONET_RC}" HRRR_RC="${HRRR_RC}" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          tag = os.environ["LOCAL_DATE_TAG"]
          today = dt.datetime.strptime(tag, "%Y%m%d").date()

          econet_valid = False
          if os.environ["ECONET_RC"] == "0":
              try:
                  data = json.loads(
                      Path("/tmp/late-check/1030.json").read_text(encoding="utf-8")
                  )
                  generated = dt.datetime.fromisoformat(
                      str(data["generated_at"]).replace("Z", "+00:00")
                  ).astimezone(eastern)
                  minute = generated.hour * 60 + generated.minute
                  econet_valid = (
                      data.get("station", {}).get("id") == "MORG"
                      and generated.date() == today
                      and (10 * 60) <= minute <= (11 * 60 + 20)
                      and data.get("status") == "current"
                      and data.get("freshness", {}).get("within_limit") is True
                      and data.get("quality_control", {}).get(
                          "flag_metadata_verified"
                      ) is True
                  )
              except Exception:
                  econet_valid = False

          hrrr_exists = os.environ["HRRR_RC"] == "0"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"econet_1030_valid={'true' if econet_valid else 'false'}\n")
              out.write(f"hrrr_exists={'true' if hrrr_exists else 'false'}\n")

          print(f"Pages 10:30 ECONet valid: {econet_valid}")
          print(f"Pages current-day HRRR path exists: {hrrr_exists}")
          PY

      - name: Decide independent ECONet and HRRR recovery actions
        id: decide
        env:
          REPO_1030: ${{ steps.repo_check.outputs.econet_1030_valid }}
          PAGES_1030: ${{ steps.pages_check.outputs.econet_1030_valid }}
          ECONET_SLOT: ${{ steps.meta.outputs.econet_slot_state }}
          REPO_HRRR: ${{ steps.repo_check.outputs.hrrr_valid }}
          PAGES_HRRR: ${{ steps.pages_check.outputs.hrrr_exists }}
        run: |
          if [[ "${REPO_1030}" == "true" && "${PAGES_1030}" == "true" ]]; then
            ECONET_ACTION="none"
          elif [[ "${REPO_1030}" != "true" && "${PAGES_1030}" == "true" ]]; then
            ECONET_ACTION="recover_repo"
          elif [[ "${REPO_1030}" == "true" ]]; then
            ECONET_ACTION="redeploy"
          elif [[ "${ECONET_SLOT}" == "in" ]]; then
            ECONET_ACTION="extract"
          elif [[ "${ECONET_SLOT}" == "after" ]]; then
            ECONET_ACTION="missed"
          else
            ECONET_ACTION="none"
          fi

          if [[ "${REPO_HRRR}" == "true" && "${PAGES_HRRR}" == "true" ]]; then
            HRRR_ACTION="none"
          elif [[ "${REPO_HRRR}" != "true" && "${PAGES_HRRR}" == "true" ]]; then
            HRRR_ACTION="recover_repo"
          else
            HRRR_ACTION="extract"
          fi

          echo "econet_action=${ECONET_ACTION}" >> "${GITHUB_OUTPUT}"
          echo "hrrr_action=${HRRR_ACTION}" >> "${GITHUB_OUTPUT}"
          echo "ECONet action: ${ECONET_ACTION}"
          echo "HRRR action: ${HRRR_ACTION}"

      - name: Check whether required 12Z HRRR terminal hour is available
        id: hrrr_ready
        if: steps.decide.outputs.hrrr_action == 'extract'
        run: |
          PYTHONPATH=. python - <<'PY'
          import datetime as dt
          import os
          import time

          from burke_hrrr.noaa import Cycle, cycle_has_forecast

          cycle_time = dt.datetime.strptime(
              os.environ["HRRR_CYCLE"], "%Y%m%d%H"
          ).replace(tzinfo=dt.UTC)
          required_fhr = int(os.environ["HRRR_REQUIRED_FHR"])
          cycle = Cycle(cycle_time)

          ready = False
          for attempt in range(1, 3):
              if cycle_has_forecast(cycle, required_fhr, timeout=20.0):
                  ready = True
                  break
              if attempt < 2:
                  print(
                      f"HRRR f{required_fhr:02d} not ready; "
                      "one short retry in 60 seconds"
                  )
                  time.sleep(60)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ready={'true' if ready else 'false'}\n")
          print(
              f"12Z HRRR f{required_fhr:02d} available: {ready}. "
              "No long wait is used; a later scheduled attempt will retry."
          )
          PY

      - name: Determine whether an extraction environment is needed
        id: extract_plan
        env:
          ECONET_ACTION: ${{ steps.decide.outputs.econet_action }}
          HRRR_ACTION: ${{ steps.decide.outputs.hrrr_action }}
          HRRR_READY: ${{ steps.hrrr_ready.outputs.ready }}
        run: |
          NEED="false"
          if [[ "${ECONET_ACTION}" == "extract" ]]; then
            NEED="true"
          fi
          if [[ "${HRRR_ACTION}" == "extract" && "${HRRR_READY}" == "true" ]]; then
            NEED="true"
          fi
          echo "needed=${NEED}" >> "${GITHUB_OUTPUT}"

      - name: Install extractors and dependencies
        if: steps.extract_plan.outputs.needed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ecCodes runtime
        if: steps.decide.outputs.hrrr_action == 'extract' && steps.hrrr_ready.outputs.ready == 'true'
        run: python -m eccodes selfcheck

      - name: Run unit tests before extraction
        if: steps.extract_plan.outputs.needed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Determine whether Pages deployment will be needed
        id: publish_plan
        env:
          ECONET_ACTION: ${{ steps.decide.outputs.econet_action }}
          HRRR_ACTION: ${{ steps.decide.outputs.hrrr_action }}
          HRRR_READY: ${{ steps.hrrr_ready.outputs.ready }}
        run: |
          DEPLOY="false"
          if [[ "${ECONET_ACTION}" == "extract" || "${ECONET_ACTION}" == "redeploy" ]]; then
            DEPLOY="true"
          fi
          if [[ "${HRRR_ACTION}" == "extract" && "${HRRR_READY}" == "true" ]]; then
            DEPLOY="true"
          fi
          echo "deploy_needed=${DEPLOY}" >> "${GITHUB_OUTPUT}"
          echo "Pages deployment needed: ${DEPLOY}"

      - name: Preserve current Pages products before any deployment
        if: steps.publish_plan.outputs.deploy_needed == 'true'
        run: |
          mkdir -p public/hrrr public/econet
          CB="$(date +%s%N)"

          curl \
            --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/burke-hrrr.json?cb=${CB}" \
            --output public/burke-hrrr.json
          python -m json.tool public/burke-hrrr.json > /dev/null

          curl \
            --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/morg-econet.json?cb=${CB}" \
            --output public/morg-econet.json
          python -m json.tool public/morg-econet.json > /dev/null

          if curl \
            --fail --silent --show-error --location \
            --retry 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/hrrr/${LOCAL_DATE_TAG}-12z.json?cb=${CB}" \
            --output "public/hrrr/${LOCAL_DATE_TAG}-12z.json"; then
            echo "Preserved current-day HRRR date path"
          else
            rm -f "public/hrrr/${LOCAL_DATE_TAG}-12z.json"
          fi

          if curl \
            --fail --silent --show-error --location \
            --retry 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/econet/${LOCAL_DATE_TAG}-1030.json?cb=${CB}" \
            --output "public/econet/${LOCAL_DATE_TAG}-1030.json"; then
            echo "Preserved current-day 10:30 ECONet date path"
          else
            rm -f "public/econet/${LOCAL_DATE_TAG}-1030.json"
          fi

          if [[ "${{ steps.repo_check.outputs.econet_0830_valid }}" == "true" ]]; then
            cp current/morg-econet-0830.json "public/econet/${LOCAL_DATE_TAG}-0830.json"
            echo "Preserved 08:30 ECONet from repository snapshot"
          elif curl \
            --fail --silent --show-error --location \
            --retry 2 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/econet/${LOCAL_DATE_TAG}-0830.json?cb=${CB}" \
            --output "public/econet/${LOCAL_DATE_TAG}-0830.json"; then
            echo "Preserved 08:30 ECONet from Pages"
          else
            rm -f "public/econet/${LOCAL_DATE_TAG}-0830.json"
            echo "No valid/current 08:30 snapshot available to preserve"
          fi

      - name: Recover repository 10:30 ECONet snapshot from valid Pages copy
        if: steps.decide.outputs.econet_action == 'recover_repo'
        run: |
          mkdir -p current
          cp /tmp/late-check/1030.json current/morg-econet-1030.json
          python -m json.tool current/morg-econet-1030.json > /dev/null

      - name: Run MORG 10:30 ECONet extractor
        if: steps.decide.outputs.econet_action == 'extract'
        env:
          NCSCO_CLOUDS_HASH: ${{ secrets.NCSCO_CLOUDS_HASH }}
        run: |
          morg-econet --output public/morg-econet.json

      - name: Validate newly generated 10:30 ECONet JSON
        if: steps.decide.outputs.econet_action == 'extract'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          tag = os.environ["LOCAL_DATE_TAG"]
          data = json.loads(Path("public/morg-econet.json").read_text(encoding="utf-8"))

          if data.get("station", {}).get("id") != "MORG":
              raise SystemExit("ECONet output is not for MORG")
          if data.get("schema_version") != 1:
              raise SystemExit(f"unexpected ECONet schema: {data.get('schema_version')!r}")
          if data.get("status") != "current":
              raise SystemExit(f"ECONet status is not current: {data.get('status')!r}")
          if data.get("freshness", {}).get("within_limit") is not True:
              raise SystemExit("ECONet freshness.within_limit is not true")
          if data.get("quality_control", {}).get("flag_metadata_verified") is not True:
              raise SystemExit("ECONet QC flag metadata is not verified")

          generated = dt.datetime.fromisoformat(
              str(data["generated_at"]).replace("Z", "+00:00")
          ).astimezone(eastern)
          minute = generated.hour * 60 + generated.minute
          if generated.strftime("%Y%m%d") != tag:
              raise SystemExit("ECONet 10:30 snapshot has wrong Eastern date")
          if not ((10 * 60) <= minute <= (11 * 60 + 20)):
              raise SystemExit(
                  f"ECONet generated outside 10:30 slot: {generated.isoformat()}"
              )

          rainfall = data.get("rainfall", {})
          soil = data.get("soil_moisture", {})
          for period in ("24h", "72h", "168h"):
              if period not in rainfall:
                  raise SystemExit(f"missing ECONet rainfall period: {period}")
          for depth in ("10cm", "20cm"):
              if depth not in soil:
                  raise SystemExit(f"missing ECONet soil depth: {depth}")
              if soil[depth].get("qc_score") not in {0, 1}:
                  raise SystemExit(f"unacceptable current QC score for {depth}")
              if "value" in soil[depth] or "current_value_m3m3" in soil[depth]:
                  raise SystemExit(
                      "public ECONet summary must not republish raw soil-moisture values"
                  )

          print(f"Validated MORG 10:30 snapshot generated {generated.isoformat()}")
          PY

      - name: Stage 10:30 ECONet for Pages and repository
        if: steps.decide.outputs.econet_action == 'extract'
        run: |
          mkdir -p public/econet current
          cp public/morg-econet.json "public/econet/${LOCAL_DATE_TAG}-1030.json"
          cp public/morg-econet.json current/morg-econet-1030.json
          python -m json.tool "public/econet/${LOCAL_DATE_TAG}-1030.json" > /dev/null
          python -m json.tool current/morg-econet-1030.json > /dev/null

      - name: Stage existing repository 10:30 ECONet snapshot for Pages recovery
        if: steps.decide.outputs.econet_action == 'redeploy'
        run: |
          mkdir -p public/econet
          cp current/morg-econet-1030.json public/morg-econet.json
          cp current/morg-econet-1030.json "public/econet/${LOCAL_DATE_TAG}-1030.json"
          python -m json.tool "public/econet/${LOCAL_DATE_TAG}-1030.json" > /dev/null

      - name: Run Burke County HRRR extractor
        if: steps.decide.outputs.hrrr_action == 'extract' && steps.hrrr_ready.outputs.ready == 'true'
        run: |
          mkdir -p public
          burke-hrrr \
            --cycle "${HRRR_CYCLE}" \
            --workdir "${RUNNER_TEMP}/hrrr-data" \
            --output public/burke-hrrr.json

      - name: Validate newly generated current-day HRRR JSON
        if: steps.decide.outputs.hrrr_action == 'extract' && steps.hrrr_ready.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import math
          import os
          from pathlib import Path

          now = dt.datetime.now(dt.UTC)
          expected_cycle = dt.datetime.strptime(
              os.environ["HRRR_CYCLE"], "%Y%m%d%H"
          ).replace(tzinfo=dt.UTC)
          expected_through = dt.datetime.fromisoformat(
              os.environ["HRRR_EXPECTED_THROUGH"]
          ).astimezone(dt.UTC)

          path = Path("public/burke-hrrr.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          required_top_level = [
              "schema_version",
              "extractor_version",
              "generated_at",
              "cycle_initialized",
              "through",
              "forecast_hours",
              "operational_summary",
          ]
          missing = [key for key in required_top_level if key not in data]
          if missing:
              raise SystemExit(f"missing required HRRR JSON fields: {missing}")
          if data["schema_version"] != 2:
              raise SystemExit(
                  f"expected HRRR schema_version 2, got {data['schema_version']!r}"
              )
          if data.get("extractor_version") != "0.3.2":
              raise SystemExit(
                  f"expected extractor_version 0.3.2, got {data.get('extractor_version')!r}"
              )
          if not data["forecast_hours"]:
              raise SystemExit("HRRR forecast_hours is empty")

          generated = dt.datetime.fromisoformat(
              data["generated_at"].replace("Z", "+00:00")
          )
          age_minutes = (now - generated.astimezone(dt.UTC)).total_seconds() / 60
          if age_minutes < -5 or age_minutes > 45:
              raise SystemExit(
                  f"HRRR generated_at is unexpectedly stale: {age_minutes:.1f} minutes"
              )

          cycle = dt.datetime.fromisoformat(
              data["cycle_initialized"].replace("Z", "+00:00")
          ).astimezone(dt.UTC)
          if cycle != expected_cycle:
              raise SystemExit(
                  f"wrong HRRR cycle: expected {expected_cycle.isoformat()}, got {cycle.isoformat()}"
              )

          through = dt.datetime.fromisoformat(
              data["through"].replace("Z", "+00:00")
          ).astimezone(dt.UTC)
          if through < expected_through:
              raise SystemExit(
                  f"HRRR coverage ends too early: {through.isoformat()} < "
                  f"{expected_through.isoformat()}"
              )

          valid_times = [
              dt.datetime.fromisoformat(
                  str(hour["valid_time"]).replace("Z", "+00:00")
              ).astimezone(dt.UTC)
              for hour in data["forecast_hours"]
              if hour.get("valid_time")
          ]
          if not valid_times or max(valid_times) < expected_through:
              raise SystemExit(
                  "HRRR forecast_hours do not actually reach local midnight"
              )

          required_diagnostics = {
              "surface_gust_mph",
              "max_downdraft_magnitude_ms",
              "cape_90_0mb_jkg",
              "lapse_rate_700_500mb_k_per_km",
              "bulk_shear_sfc_500mb_kt",
          }

          def usable_metric(key):
              for hour in data["forecast_hours"]:
                  diagnostics = hour.get("key_diagnostics")
                  if not isinstance(diagnostics, dict):
                      continue
                  metric = diagnostics.get(key)
                  if not isinstance(metric, dict):
                      continue
                  summary = metric.get("summary")
                  if not isinstance(summary, dict) or int(summary.get("count") or 0) <= 0:
                      continue
                  values = [summary.get("p90"), summary.get("max")]
                  if any(
                      isinstance(v, (int, float)) and math.isfinite(float(v))
                      for v in values
                  ):
                      return True
              return False

          unusable = sorted(
              key for key in required_diagnostics if not usable_metric(key)
          )
          if unusable:
              raise SystemExit(
                  "HRRR core diagnostics have no finite populated values: "
                  + ", ".join(unusable)
              )

          print(f"HRRR generated: {data['generated_at']}")
          print(f"HRRR cycle: {data['cycle_initialized']}")
          print(f"HRRR through: {data['through']}")
          print(f"HRRR forecast hours: {len(data['forecast_hours'])}")
          PY

      - name: Stage new HRRR Pages path and compact repository snapshot
        if: steps.decide.outputs.hrrr_action == 'extract' && steps.hrrr_ready.outputs.ready == 'true'
        run: |
          mkdir -p public/hrrr current
          cp public/burke-hrrr.json "public/hrrr/${LOCAL_DATE_TAG}-12z.json"
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          src = json.loads(
              Path("public/burke-hrrr.json").read_text(encoding="utf-8")
          )
          compact = {
              "schema_version": 1,
              "snapshot_type": "burke_hrrr_12z_decision_support",
              "snapshot_published_at": dt.datetime.now(dt.UTC).isoformat(),
              "extractor_version": src.get("extractor_version"),
              "generated_at": src.get("generated_at"),
              "cycle_initialized": src.get("cycle_initialized"),
              "through": src.get("through"),
              "domain": src.get("domain"),
              "forecast_hour_count": len(src.get("forecast_hours") or []),
              "operational_summary": src.get("operational_summary") or {},
              "forecast_hours": [
                  {
                      "forecast_hour": hour.get("forecast_hour"),
                      "valid_time": hour.get("valid_time"),
                      "key_diagnostics": hour.get("key_diagnostics") or {},
                  }
                  for hour in (src.get("forecast_hours") or [])
              ],
          }
          Path("current/burke-hrrr-12z.json").write_text(
              json.dumps(compact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m json.tool current/burke-hrrr-12z.json > /dev/null

      - name: Recover compact HRRR repository snapshot from valid Pages file
        if: steps.decide.outputs.hrrr_action == 'recover_repo'
        run: |
          mkdir -p current /tmp/late-check
          CB="$(date +%s%N)"
          curl \
            --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "https://mckeetj.github.io/morganton-hrrr-extractor/hrrr/${LOCAL_DATE_TAG}-12z.json?cb=${CB}" \
            --output /tmp/late-check/hrrr-full.json

          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          src = json.loads(
              Path("/tmp/late-check/hrrr-full.json").read_text(encoding="utf-8")
          )
          expected_cycle = dt.datetime.strptime(
              os.environ["HRRR_CYCLE"], "%Y%m%d%H"
          ).replace(tzinfo=dt.UTC)
          expected_through = dt.datetime.fromisoformat(
              os.environ["HRRR_EXPECTED_THROUGH"]
          ).astimezone(dt.UTC)
          cycle = dt.datetime.fromisoformat(
              src["cycle_initialized"].replace("Z", "+00:00")
          ).astimezone(dt.UTC)
          through = dt.datetime.fromisoformat(
              src["through"].replace("Z", "+00:00")
          ).astimezone(dt.UTC)
          if cycle != expected_cycle or through < expected_through:
              raise SystemExit("Pages HRRR is not the required current-day cycle")

          compact = {
              "schema_version": 1,
              "snapshot_type": "burke_hrrr_12z_decision_support",
              "snapshot_published_at": dt.datetime.now(dt.UTC).isoformat(),
              "extractor_version": src.get("extractor_version"),
              "generated_at": src.get("generated_at"),
              "cycle_initialized": src.get("cycle_initialized"),
              "through": src.get("through"),
              "domain": src.get("domain"),
              "forecast_hour_count": len(src.get("forecast_hours") or []),
              "operational_summary": src.get("operational_summary") or {},
              "forecast_hours": [
                  {
                      "forecast_hour": hour.get("forecast_hour"),
                      "valid_time": hour.get("valid_time"),
                      "key_diagnostics": hour.get("key_diagnostics") or {},
                  }
                  for hour in (src.get("forecast_hours") or [])
              ],
          }
          Path("current/burke-hrrr-12z.json").write_text(
              json.dumps(compact, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m json.tool current/burke-hrrr-12z.json > /dev/null

      - name: Build current health manifest only when state changes
        run: |
          mkdir -p current
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          tag = os.environ["LOCAL_DATE_TAG"]
          today = dt.datetime.strptime(tag, "%Y%m%d").date()

          def parse_time(value):
              return dt.datetime.fromisoformat(
                  str(value).replace("Z", "+00:00")
              )

          def econet_state(path, start_minute, end_minute):
              p = Path(path)
              if not p.exists():
                  return {"status": "missing", "path": path}
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  generated = parse_time(data["generated_at"]).astimezone(eastern)
                  minute = generated.hour * 60 + generated.minute
                  valid = (
                      data.get("station", {}).get("id") == "MORG"
                      and generated.date() == today
                      and start_minute <= minute <= end_minute
                      and data.get("status") == "current"
                      and data.get("freshness", {}).get("within_limit") is True
                      and data.get("quality_control", {}).get(
                          "flag_metadata_verified"
                      ) is True
                  )
                  return {
                      "status": "valid" if valid else "not_current_for_today",
                      "path": path,
                      "generated_at": data.get("generated_at"),
                  }
              except Exception as exc:
                  return {
                      "status": "invalid",
                      "path": path,
                      "reason": f"{type(exc).__name__}: {exc}",
                  }

          def hrrr_state(path):
              p = Path(path)
              if not p.exists():
                  return {"status": "missing", "path": path}
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  cycle = parse_time(data["cycle_initialized"]).astimezone(dt.UTC)
                  through = parse_time(data["through"]).astimezone(dt.UTC)
                  expected_cycle = dt.datetime.combine(
                      today, dt.time(12), tzinfo=dt.UTC
                  )
                  expected_through = dt.datetime.fromisoformat(
                      os.environ["HRRR_EXPECTED_THROUGH"]
                  ).astimezone(dt.UTC)
                  valid = cycle == expected_cycle and through >= expected_through
                  return {
                      "status": "valid" if valid else "not_current_for_today",
                      "path": path,
                      "generated_at": data.get("generated_at"),
                      "cycle_initialized": data.get("cycle_initialized"),
                      "through": data.get("through"),
                  }
              except Exception as exc:
                  return {
                      "status": "invalid",
                      "path": path,
                      "reason": f"{type(exc).__name__}: {exc}",
                  }

          core = {
              "schema_version": 1,
              "date_eastern": today.isoformat(),
              "econet_0830": econet_state(
                  "current/morg-econet-0830.json", 7 * 60 + 40, 8 * 60 + 50
              ),
              "econet_1030": econet_state(
                  "current/morg-econet-1030.json", 10 * 60, 11 * 60 + 20
              ),
              "hrrr_12z": hrrr_state("current/burke-hrrr-12z.json"),
          }

          path = Path("current/status.json")
          existing = None
          if path.exists():
              try:
                  existing = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  existing = None

          comparable_existing = None
          if isinstance(existing, dict):
              comparable_existing = {
                  key: existing.get(key)
                  for key in (
                      "schema_version",
                      "date_eastern",
                      "econet_0830",
                      "econet_1030",
                      "hrrr_12z",
                  )
              }

          if comparable_existing == core:
              print("Health manifest state is unchanged; keeping existing updated_at")
          else:
              core["updated_at"] = dt.datetime.now(dt.UTC).isoformat()
              path.write_text(
                  json.dumps(core, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(core, indent=2, sort_keys=True))
          PY

      - name: Commit recovered/generated current snapshots and health manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current/status.json

          if [[ "${{ steps.decide.outputs.econet_action }}" == "extract" || "${{ steps.decide.outputs.econet_action }}" == "recover_repo" ]]; then
            git add current/morg-econet-1030.json
          fi

          if [[ "${{ steps.decide.outputs.hrrr_action }}" == "recover_repo" || ( "${{ steps.decide.outputs.hrrr_action }}" == "extract" && "${{ steps.hrrr_ready.outputs.ready }}" == "true" ) ]]; then
            git add current/burke-hrrr-12z.json
          fi

          if git diff --cached --quiet; then
            echo "No current repository state changes to commit"
          else
            git commit -m "Update resilient late-morning decision-support state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Validate final repository state for this run
        id: final_state
        run: |
          git fetch origin main
          mkdir -p /tmp/final-state

          set +e
          git show origin/main:current/morg-econet-1030.json > /tmp/final-state/1030.json
          ECONET_RC=$?
          git show origin/main:current/burke-hrrr-12z.json > /tmp/final-state/hrrr.json
          HRRR_RC=$?
          set -e

          ECONET_RC="${ECONET_RC}" HRRR_RC="${HRRR_RC}" python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          tag = os.environ["LOCAL_DATE_TAG"]
          today = dt.datetime.strptime(tag, "%Y%m%d").date()
          expected_cycle = dt.datetime.strptime(
              os.environ["HRRR_CYCLE"], "%Y%m%d%H"
          ).replace(tzinfo=dt.UTC)
          expected_through = dt.datetime.fromisoformat(
              os.environ["HRRR_EXPECTED_THROUGH"]
          ).astimezone(dt.UTC)

          econet_valid = False
          if os.environ["ECONET_RC"] == "0":
              try:
                  data = json.loads(
                      Path("/tmp/final-state/1030.json").read_text(encoding="utf-8")
                  )
                  generated = dt.datetime.fromisoformat(
                      str(data["generated_at"]).replace("Z", "+00:00")
                  ).astimezone(eastern)
                  minute = generated.hour * 60 + generated.minute
                  econet_valid = (
                      data.get("station", {}).get("id") == "MORG"
                      and generated.date() == today
                      and (10 * 60) <= minute <= (11 * 60 + 20)
                      and data.get("status") == "current"
                      and data.get("freshness", {}).get("within_limit") is True
                      and data.get("quality_control", {}).get(
                          "flag_metadata_verified"
                      ) is True
                  )
              except Exception:
                  econet_valid = False

          hrrr_valid = False
          if os.environ["HRRR_RC"] == "0":
              try:
                  data = json.loads(
                      Path("/tmp/final-state/hrrr.json").read_text(encoding="utf-8")
                  )
                  cycle = dt.datetime.fromisoformat(
                      data["cycle_initialized"].replace("Z", "+00:00")
                  ).astimezone(dt.UTC)
                  through = dt.datetime.fromisoformat(
                      data["through"].replace("Z", "+00:00")
                  ).astimezone(dt.UTC)
                  hrrr_valid = (
                      cycle == expected_cycle and through >= expected_through
                  )
              except Exception:
                  hrrr_valid = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"econet_1030_valid={'true' if econet_valid else 'false'}\n")
              out.write(f"hrrr_valid={'true' if hrrr_valid else 'false'}\n")

          print(f"Final origin/main 10:30 ECONet valid: {econet_valid}")
          print(f"Final origin/main HRRR valid: {hrrr_valid}")
          PY

      - name: Configure GitHub Pages
        if: steps.publish_plan.outputs.deploy_needed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.publish_plan.outputs.deploy_needed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./public"

  deploy:
    if: needs.build.outputs.deploy_needed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify expected current-day Pages products survived deployment
        env:
          LOCAL_DATE_TAG: ${{ needs.build.outputs.local_date_tag }}
          EXPECT_0830: ${{ needs.build.outputs.expect_0830 }}
          EXPECT_1030: ${{ needs.build.outputs.expect_1030 }}
          EXPECT_HRRR: ${{ needs.build.outputs.expect_hrrr }}
        run: |
          for attempt in $(seq 1 12); do
            CB="$(date +%s%N)"
            OK="true"

            if [[ "${EXPECT_0830}" == "true" ]]; then
              if ! curl \
                --fail --silent --show-error --location \
                -H "Cache-Control: no-cache" \
                "https://mckeetj.github.io/morganton-hrrr-extractor/econet/${LOCAL_DATE_TAG}-0830.json?cb=${CB}" \
                --output /tmp/check-0830.json; then
                OK="false"
              fi
            fi

            if [[ "${EXPECT_1030}" == "true" ]]; then
              if ! curl \
                --fail --silent --show-error --location \
                -H "Cache-Control: no-cache" \
                "https://mckeetj.github.io/morganton-hrrr-extractor/econet/${LOCAL_DATE_TAG}-1030.json?cb=${CB}" \
                --output /tmp/check-1030.json; then
                OK="false"
              fi
            fi

            if [[ "${EXPECT_HRRR}" == "true" ]]; then
              if ! curl \
                --fail --silent --show-error --location --head \
                -H "Cache-Control: no-cache" \
                "https://mckeetj.github.io/morganton-hrrr-extractor/hrrr/${LOCAL_DATE_TAG}-12z.json?cb=${CB}" \
                --output /tmp/check-hrrr-head.txt; then
                OK="false"
              fi
            fi

            if [[ "${OK}" == "true" ]]; then
              if python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          tag = os.environ["LOCAL_DATE_TAG"]
          today = dt.datetime.strptime(tag, "%Y%m%d").date()

          def validate_econet(path, start_minute, end_minute):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              generated = dt.datetime.fromisoformat(
                  str(data["generated_at"]).replace("Z", "+00:00")
              ).astimezone(eastern)
              minute = generated.hour * 60 + generated.minute
              return (
                  data.get("station", {}).get("id") == "MORG"
                  and generated.date() == today
                  and start_minute <= minute <= end_minute
                  and data.get("status") == "current"
                  and data.get("freshness", {}).get("within_limit") is True
                  and data.get("quality_control", {}).get(
                      "flag_metadata_verified"
                  ) is True
              )

          valid = True
          if os.environ["EXPECT_0830"] == "true":
              valid = valid and validate_econet(
                  "/tmp/check-0830.json", 7 * 60 + 40, 8 * 60 + 50
              )
          if os.environ["EXPECT_1030"] == "true":
              valid = valid and validate_econet(
                  "/tmp/check-1030.json", 10 * 60, 11 * 60 + 20
              )

          raise SystemExit(0 if valid else 1)
          PY
              then
                echo "Verified expected current-day Pages products"
                exit 0
              fi
            fi

            echo "Pages verification not complete (attempt ${attempt}/12)"
            sleep 15
          done

          echo "One or more expected current-day Pages products failed verification"
          exit 1
