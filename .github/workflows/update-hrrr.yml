name: Update Burke County HRRR Data

on:
  workflow_dispatch:
  schedule:
    - cron: "45 9 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install extractor and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run Burke County HRRR extractor
        run: |
          mkdir -p public
          burke-hrrr \
            --workdir "${RUNNER_TEMP}/hrrr-data" \
            --output public/burke-hrrr.json

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          path = Path("public/burke-hrrr.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "schema_version",
              "generated_at",
              "cycle_initialized",
              "through",
              "forecast_hours",
          ]
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f"missing required JSON fields: {missing}")
          if not data["forecast_hours"]:
              raise SystemExit("forecast_hours is empty")

          generated = dt.datetime.fromisoformat(
              data["generated_at"].replace("Z", "+00:00")
          )
          age_minutes = (
              dt.datetime.now(dt.UTC) - generated.astimezone(dt.UTC)
          ).total_seconds() / 60

          if age_minutes < -5 or age_minutes > 45:
              raise SystemExit(
                  f"generated_at is unexpectedly stale: "
                  f"{age_minutes:.1f} minutes"
              )

          print(f"Generated: {data['generated_at']}")
          print(f"HRRR cycle: {data['cycle_initialized']}")
          print(f"Through: {data['through']}")
          print(f"Forecast hours: {len(data['forecast_hours'])}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./public"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
