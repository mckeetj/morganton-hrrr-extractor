name: ChatGPT Trigger - Morning ECONet

# Independent trigger path for the MORG 08:30 snapshot.
# A ChatGPT scheduled task updates triggers/morning-econet.txt; this push
# then dispatches the existing production workflow through workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "triggers/morning-econet.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: "chatgpt-trigger-morning"
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production morning ECONet workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-morg-econet.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Dispatched update-morg-econet.yml"
