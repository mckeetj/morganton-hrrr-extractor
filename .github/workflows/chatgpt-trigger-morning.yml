name: ChatGPT Trigger - Morning ECONet

# Manual fallback trigger path for the MORG 08:30 snapshot.
# A deliberate push to triggers/morning-econet.txt dispatches the existing
# production workflow. Routine timing is owned by weather-orchestrator.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "triggers/morning-econet.txt"

permissions:
  actions: write
  contents: read

concurrency:
  group: "chatgpt-trigger-morning"
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production morning ECONet workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-morg-econet.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
          echo "Dispatched update-morg-econet.yml"
