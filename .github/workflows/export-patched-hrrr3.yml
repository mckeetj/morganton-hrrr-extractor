name: Export patched late workflow v3

on:
  push:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build patched text
        run: python tmp/export_patched_hrrr.py
      - name: Publish patched text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/update-hrrr-patched.txt
          if git diff --cached --quiet; then
            echo "Temporary patched text already current"
          else
            git commit -m "Export patched late workflow for connected editor [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
