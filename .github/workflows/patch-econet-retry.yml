name: One-time ECONet retry patch

on:
  push:
    paths:
      - ".github/workflows/patch-econet-retry.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch late-morning ECONet retry behavior
        env:
          OLD_B64: 
          NEW_B64: 
          MARKER_B64: ICAgICAgLSBuYW1lOiBDb25maWd1cmUgR2l0SHViIFBhZ2VzCiAgICAgICAgaWY6IHN0ZXBzLnB1Ymxpc2hfcGxhbi5vdXRwdXRzLmRlcGxveV9uZWVkZWQgPT0gJ3RydWUnCiAgICAgICAgdXNlczogYWN0aW9ucy9jb25maWd1cmUtcGFnZXNAdjYK
          ALERT_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('.github/workflows/update-hrrr.yml')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          marker = base64.b64decode(os.environ['MARKER_B64']).decode()
          alert = base64.b64decode(os.environ['ALERT_B64']).decode()

          if old not in text:
              raise SystemExit('Expected 10:30 ECONet validator block not found')
          if marker not in text:
              raise SystemExit('Configure Pages marker not found')

          text = text.replace(old, new, 1)
          text = text.replace(marker, alert + marker, 1)
          text = text.replace(
              '# V3.9: resilient late-morning publishing with same-day ECONet recovery.',
              '# V3.10: resilient late-morning publishing with retryable ECONet unavailability.',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-hrrr.yml
          git rm .github/workflows/patch-econet-retry.yml
          git commit -m "Treat temporary late-morning ECONet unavailability as retryable [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
