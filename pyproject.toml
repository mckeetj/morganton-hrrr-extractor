[project]
name = "burke-hrrr"
version = "0.3.2"
description = "Burke County HRRR environmental field extractor"
requires-python = ">=3.11"
dependencies = [
  "cfgrib>=0.9.14",
  "eccodes==2.48.0",
  "eccodeslib==2.48.2.27",
  "eckitlib==2.2.0.27",
  "metpy>=1.6",
  "numpy>=1.26",
  "xarray>=2024.1",
]

[project.scripts]
burke-hrrr = "burke_hrrr.cli:main"
morg-econet = "burke_hrrr.econet:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["burke_hrrr*"]

